<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simon Says</title>
    <link rel="stylesheet" href="sms.css">
</head>
<body>
    <h1>Simon Says Game</h1>
    <h2>Press any key to start the Game</h2>
    <div class="btn-container">
        <div class="line-1">
        <div class="btn pink" id="pink">1</div>
        <div class="btn blue" id="blue">2</div>
        </div>
        <div class="line-2">
        <div class="btn green" id="green">3</div>
        <div class="btn yellow" id="yellow">4</div>
        </div>
    </div>
    <script src="sms.js"></script>
</body>
</html>
